name: build

on:
  push:
    branches: [main]
    paths: ["images/**"]
  pull_request:
    paths: ["images/**"]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC: fresh build of every image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        name: Pick images to build
        run: |
          all=$(find images -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' | xargs -rn1 basename | sort)
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              names="$all" ;;
            pull_request)
              names=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- images | cut -d/ -f2 | sort -u) ;;
            *)
              before="${{ github.event.before }}"
              if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
                names="$all"
              else
                names=$(git diff --name-only "$before" HEAD -- images | cut -d/ -f2 | sort -u)
              fi ;;
          esac
          # Keep only folders that still have a Dockerfile (skips deleted images).
          images=$(for n in $names; do [ -f "images/$n/Dockerfile" ] && echo "$n"; done | jq -Rnc '[inputs | select(length > 0)]')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Building: $images"

  build:
    needs: discover
    if: needs.discover.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # The build number (github.run_number, shared by all images, only
          # goes up) is what the cluster pins and Renovate bumps; latest is for
          # trying an image by hand.
          tags: |
            type=raw,value=${{ github.run_number }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          # No layer cache on scheduled builds, so "latest" really means latest.
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
