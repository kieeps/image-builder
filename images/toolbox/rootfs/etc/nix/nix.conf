# Single-user Nix as kieeps; the store (/nix) is a persistent volume.
# Always the local store in /nix ("auto" falls back to a chroot store in ~ when
# /nix/store does not exist yet, which nix-shell cannot run from).
store = local
build-users-group =
sandbox = false
experimental-features = nix-command flakes
# Lets `nix-shell -p foo` work without channels.
nix-path = nixpkgs=flake:nixpkgs
