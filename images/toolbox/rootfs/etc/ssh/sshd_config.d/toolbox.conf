# Key-only SSH for the single toolbox user. Host keys and authorized_keys are
# generated by toolbox-entrypoint (state lives in /var/lib/toolbox).
HostKey /var/lib/toolbox/ssh/ssh_host_ed25519_key
HostKey /var/lib/toolbox/ssh/ssh_host_rsa_key
AuthorizedKeysFile /run/toolbox/authorized_keys
AllowUsers kieeps
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM no
PrintMotd no
AcceptEnv LANG LC_*
ClientAliveInterval 60
ClientAliveCountMax 3
